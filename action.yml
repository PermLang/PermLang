name: PermLang
description: Check what each function can touch, and comment the permission diff on pull requests.
author: PermLang

inputs:
  args:
    description: Arguments for `permlang check`, such as source paths or `--project tsconfig.json`.
    required: false
    default: ""
  strictness:
    description: sketch, development, or production. Overrides permlang.config.json.
    required: false
    default: ""
  working-directory:
    description: Directory containing the code, permlang.config.json, and permlang.lock.json.
    required: false
    default: "."
  comment:
    description: Post the permission diff as a pull-request comment (updated in place on later pushes).
    required: false
    default: "true"
  github-token:
    description: "Token for posting the comment. Needs `pull-requests: write` permission."
    required: false
    default: ${{ github.token }}

outputs:
  exit-code:
    description: The exit code of `permlang check` (0 no errors, 1 permission errors, 2 configuration error).
    value: ${{ steps.check.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Build PermLang
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts --no-audit --no-fund && npm run build

    - name: Check permissions
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PERMLANG: ${{ github.action_path }}/dist/cli.js
        STRICTNESS: ${{ inputs.strictness }}
        ARGS: ${{ inputs.args }}
      run: |
        set +e
        set -f  # ARGS is split on spaces, like a command line, but never glob-expanded.
        extra=()
        [ -n "$STRICTNESS" ] && extra+=(--strictness "$STRICTNESS")
        node "$PERMLANG" check $ARGS "${extra[@]}"
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"

    - name: Comment the permission diff
      if: github.event_name == 'pull_request' && inputs.comment == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PERMLANG: ${{ github.action_path }}/dist/cli.js
        GH_TOKEN: ${{ inputs.github-token }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        ARGS: ${{ inputs.args }}
      run: |
        set -f  # ARGS is split on spaces, like a command line, but never glob-expanded.
        if [ ! -f permlang.lock.json ]; then
          echo "No permlang.lock.json; run \`permlang lock\` and commit it to get a permission diff."
          exit 0
        fi
        git fetch --no-tags --depth=1 origin "$BASE_SHA"
        # The same source selection as the check, so "Where it happens" can be filled in.
        node "$PERMLANG" diff "$BASE_SHA" $ARGS --format markdown > "$RUNNER_TEMP/permlang-diff.md"
        cat "$RUNNER_TEMP/permlang-diff.md" >> "$GITHUB_STEP_SUMMARY"

        # A pull request from a fork gets a read-only token: the diff stays in the job summary.
        if [ "$HEAD_REPO" != "$REPO" ]; then
          echo "::notice::Pull request from a fork: the permission diff is in the job summary."
          exit 0
        fi

        # Posting is best effort: the check result, not the comment, decides the job.
        set +e
        body="$(cat "$RUNNER_TEMP/permlang-diff.md")"
        existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- permlang-diff -->")) | .id' | head -1)
        if [ -n "$existing" ]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null
        else
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
        fi
        if [ $? -ne 0 ]; then
          echo "::warning::Couldn't post the permission diff comment (the token needs pull-requests: write). It's in the job summary."
        fi

    - name: Fail on permission errors
      shell: bash
      env:
        CODE: ${{ steps.check.outputs.exit-code }}
      run: exit "$CODE"
