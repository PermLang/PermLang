name: PermLang

# PermLang checks its own source with its own GitHub Action, comments the
# permission diff on pull requests, and uploads its findings to code scanning.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write # the sarif upload

jobs:
  permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          args: src
          sarif: true
